name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste secrets, tokens, private keys, wallet credentials, or private production data. Security vulnerabilities should be reported privately to support@ailinux.me."
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. v1.2.6 or git SHA"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "OS, architecture, runtime"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / diagnostics
      render: shell

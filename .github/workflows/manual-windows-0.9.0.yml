name: Windows Build 1.0.0

on:
  push:
    branches:
      - ci/windows-aicoder-1.0.0
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  VERSION: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Verify project version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$PROJECT_VERSION" = "$VERSION"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install -e .

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller aicoder-windows.spec --noconfirm --clean
          if (-not (Test-Path 'dist\aicoder.exe')) { throw 'aicoder.exe was not created' }
          $size = (Get-Item dist\aicoder.exe).Length / 1MB
          Write-Host "aicoder.exe: $([math]::Round($size,1)) MB"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $pluginZip = Join-Path $env:RUNNER_TEMP 'EnVar-Plugin.zip'
          Invoke-WebRequest -Uri 'https://github.com/GsNSIS/EnVar/releases/download/v0.3.1/EnVar-Plugin.zip' -OutFile $pluginZip
          & 7z x $pluginZip '-oC:\Program Files (x86)\NSIS' -y | Out-Host

          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw "makensis not found: $makensis" }
          $envar = Get-ChildItem 'C:\Program Files (x86)\NSIS' -Recurse -Filter EnVar.dll | Select-Object -First 1
          if (-not $envar) { throw 'EnVar.dll was not installed into the NSIS tree' }
          Write-Host "Using EnVar plugin: $($envar.FullName)"

          & $makensis /V3 /DVERSION=$env:VERSION /DEXE_PATH='dist\aicoder.exe' packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "aicoder-$env:VERSION-setup.exe")) { throw 'NSIS installer was not created' }

      - name: Prepare artifacts and checksums
        shell: pwsh
        run: |
          Copy-Item dist\aicoder.exe "aicoder-$env:VERSION-windows-x64.exe"
          $files = @("aicoder-$env:VERSION-windows-x64.exe", "aicoder-$env:VERSION-setup.exe")
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Add-Content "SHA256SUMS-$env:VERSION.txt"
          }
          Get-ChildItem aicoder-*.exe, SHA256SUMS-*.txt | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: aicoder-windows-1.0.0
          if-no-files-found: error
          retention-days: 30
          path: |
            aicoder-1.0.0-windows-x64.exe
            aicoder-1.0.0-setup.exe
            SHA256SUMS-1.0.0.txt
